name: Build and Test (Arduino)

on:
  workflow_dispatch:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

env:
  # Set this to the FQBN that matches your board (change as needed)
  FQBN: esp32:esp32:esp32
  SKETCH_PATH: Games/Tetris
  BUILD_DIR: build
  ARDUINO_CLI_VERSION: "0.33.1"  # pinned version used by fallback installer

jobs:
  arduino-build:
    name: Compile sketch (arduino-cli)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Try setup arduino-cli action (pinned)
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}
        continue-on-error: true

      - name: Ensure arduino-cli is available (fallback installer)
        run: |
          if command -v arduino-cli >/dev/null 2>&1; then
            echo "arduino-cli present: $(arduino-cli version)"
          else
            echo "arduino-cli not found; installing arduino-cli v${ARDUINO_CLI_VERSION}..."
            sudo apt-get update -y
            sudo apt-get install -y ca-certificates curl unzip
            TMP=/tmp/arduino-cli
            mkdir -p "$TMP"
            ARCHIVE="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
            URL="https://downloads.arduino.cc/arduino-cli/${ARCHIVE}"
            curl -fsSL -o "$TMP/${ARCHIVE}" "$URL"
            tar -xzf "$TMP/${ARCHIVE}" -C "$TMP"
            sudo mv "$TMP/arduino-cli" /usr/local/bin/arduino-cli
            arduino-cli version
          fi

      - name: Update index & install core (esp32)
        run: |
          set -e
          arduino-cli core update-index
          # install esp32 core (change this if you target a different core/provider)
          arduino-cli core install esp32:esp32 || true
          arduino-cli core list

      - name: List available boards (debug)
        run: |
          arduino-cli board listall | sed -n '1,200p' || true
      - name: Create temporary NetConfig.h for CI (if missing)
        run: |
          if [ ! -f "${{ env.SKETCH_PATH }}/NetConfig.h" ]; then
            cat > "${{ env.SKETCH_PATH }}/NetConfig.h" <<'EOF'
            #ifndef NETCONFIG_H
            #define NETCONFIG_H
            #define EAP_IDENTITY "ci-identity"
            #define EAP_USERNAME "ci-username"
            #define EAP_PASSWORD "ci-password"
            #define EDUROAM_SSID  "eduroam"
            #define API_BASE "https://example.com"
            #define GAME_SECRET "00000000000000000000000000000000"
            #define GAME_CODE "TETR"
            #endif
            EOF
            echo "Wrote temporary NetConfig.h to ${{ env.SKETCH_PATH }}/NetConfig.h"
          else
            echo "NetConfig.h already present in repo; leaving it."
          fi

      - name: Compile sketch (Release)
        env:
          FQBN: ${{ env.FQBN }}
          SKETCH: ${{ env.SKETCH_PATH }}
          BUILD: ${{ env.BUILD_DIR }}
        run: |
          set -e
          echo "Compiling sketch $SKETCH for FQBN=$FQBN ..."
          mkdir -p "$BUILD"
          # If you keep libraries in repo/libraries, pass them to arduino-cli
          if [ -d libraries ]; then
            arduino-cli compile --fqbn "$FQBN" "$SKETCH" --build-path "$BUILD" --libraries libraries
          else
            arduino-cli compile --fqbn "$FQBN" "$SKETCH" --build-path "$BUILD"
          fi
          echo "Compile finished. Artifacts in $BUILD"

      - name: List build artifacts
        run: |
          echo "Artifacts:"
          ls -la "$BUILD" || true
          find "$BUILD" -type f -maxdepth 3 -exec ls -lh {} \; || true

      - name: Create size report
        run: |
          mkdir -p reports
          echo "Build size report for $FQBN" > reports/size-report.txt
          if [ -d "$BUILD" ]; then
            find "$BUILD" -type f -printf "%p %s bytes\n" >> reports/size-report.txt || true
          else
            echo "No build directory" >> reports/size-report.txt
          fi
          cat reports/size-report.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arduino-build-artifacts
          path: |
            build
            reports/size-report.txt
