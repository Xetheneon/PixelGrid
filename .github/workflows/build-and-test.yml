name: Build and Test (Arduino)

on:
  workflow_dispatch:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

env:
  # Change this FQBN to match your target board. Default: common esp32 placeholder.
  FQBN: esp32:esp32:esp32
  SKETCH_PATH: Games/Tetris
  BUILD_DIR: build

jobs:
  arduino-build:
    name: Compile sketch (arduino-cli)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2
        with:
          version: latest

      - name: Update index & install core (esp32)
        run: |
          arduino-cli core update-index
          # install the esp32 core used by most ESP32 boards; change if you use a different core
          arduino-cli core install esp32:esp32
          arduino-cli core list

      - name: Install required libraries from repo 'libraries' folder (optional)
        if: ${{ always() }}
        run: |
          # If you keep libraries in /libraries, install them into arduino-cli's library dir
          if [ -d libraries ]; then
            echo "Installing libraries from repo/libraries..."
            for d in libraries/*; do
              if [ -d "$d" ]; then
                arduino-cli lib install --additional-urls "" --zip-path "$d" || true
              fi
            done
          else
            echo "No libraries/ folder present; skipping."
          fi

      - name: Compile sketch (Release)
        env:
          FQBN: ${{ env.FQBN }}
          SKETCH: ${{ env.SKETCH_PATH }}
          BUILD: ${{ env.BUILD_DIR }}
        run: |
          mkdir -p "$BUILD"
          echo "Compiling sketch $SKETCH for FQBN=$FQBN ..."
          arduino-cli compile --fqbn "$FQBN" "$SKETCH" --build-path "$BUILD" || (echo "Compile failed" && exit 1)
          echo "Compile finished. Artifacts in $BUILD"

      - name: List build artifacts
        run: |
          echo "Artifacts:"
          ls -la build || true
          find build -maxdepth 3 -type f -printf "%p %s bytes\n" || true

      - name: Create size report
        run: |
          mkdir -p reports
          echo "Build size report for $FQBN" > reports/size-report.txt
          if [ -d build ]; then
            for f in build/*; do
              if [ -f "$f" ]; then
                echo "$(basename "$f"): $(stat -c%s "$f") bytes" >> reports/size-report.txt
              fi
            done
          fi
          cat reports/size-report.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arduino-build-artifacts
          path: |
            build
            reports/size-report.txt

  clang-format-check:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Run clang-format and check
        shell: bash
        run: |
          FILES=$(git ls-files '*.c' '*.cpp' '*.h' '*.hpp' || true)
          if [ -z "$FILES" ]; then
            echo "No C/C++ files to check."
            exit 0
          fi
          # Check style: format into a temp dir and compare
          TMPDIR=$(mktemp -d)
          cp $FILES "$TMPDIR/" || true
          pushd "$TMPDIR"
          clang-format -style=file -i $FILES || true
          if ! git --no-pager diff --exit-code -- $FILES; then
            echo "clang-format differences detected. Please run clang-format -style=file on these files."
            git --no-pager diff -- $FILES || true
            exit 1
          fi
          popd
